<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minima">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon-192.png?v=4" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<title>Minima Player</title>
<style>
:root{--border:#222;--white:#fff;--dim:#888;--accent:#00f2ff;--bright:#00ff95}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;background:#000;overflow:hidden;font-family:Inter,Arial,sans-serif;display:flex;justify-content:center;color:var(--white);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#stage{width:100%;max-width:500px;height:100%;position:relative;background:#000;display:flex;flex-direction:column;border-left:1px solid var(--border);border-right:1px solid var(--border)}#install-btn{display:none;position:absolute;top:14px;right:14px;z-index:3500;border:1px solid #333;background:rgba(0,0,0,.86);color:var(--accent);min-height:42px;padding:0 14px;font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;cursor:pointer}#install-btn.visible{display:block}#install-sheet{display:none;position:absolute;inset:0;z-index:5000;background:rgba(0,0,0,.93);align-items:flex-end;justify-content:center;padding:20px}#install-sheet.open{display:flex}.install-card{width:100%;border:1px solid #2b2b2b;background:#050505;padding:24px}.install-title{color:#fff;font-size:12px;letter-spacing:4px;margin-bottom:16px;text-transform:uppercase}.install-copy{color:#999;font-size:12px;line-height:1.7;letter-spacing:1px;margin-bottom:18px}.action-btn{background:none;border:1px solid var(--dim);color:#fff;font-size:11px;padding:14px;cursor:pointer;letter-spacing:3px;text-transform:uppercase}#empty-state{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;z-index:3000;background:#000}input[type=file]{display:none}#drawer{position:absolute;top:0;width:100%;height:80%;background:rgba(0,0,0,.97);border-bottom:1px solid var(--border);transform:translateY(-100%);transition:.55s cubic-bezier(.85,0,.15,1);z-index:2000;padding:40px 30px;display:flex;flex-direction:column}#drawer.open{transform:translateY(0)}#playlist-content{flex:1;overflow-y:auto}.track-row{padding:18px 0;border-bottom:1px solid #111;font-size:11px;letter-spacing:2px;display:flex;gap:12px;justify-content:space-between;cursor:pointer;color:var(--dim)}.track-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-row.playing{color:var(--bright);font-weight:bold}#visual-area{flex:1;min-height:0;position:relative;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:manipulation}#visual-core{position:relative;width:min(88%,430px);height:min(82%,430px);min-height:240px;pointer-events:none}.particle{position:absolute;left:50%;top:50%;width:30px;height:5px;pointer-events:none;z-index:5;background:currentColor;box-shadow:0 0 16px currentColor,0 0 32px currentColor;border-radius:3px;transform-origin:center;will-change:transform,width,height,opacity,left,top}#player-ui{padding:20px 24px 26px;background:#000;border-top:1px solid var(--border);z-index:1000;overflow:visible}#fx-label{font-size:10px;letter-spacing:4px;color:var(--accent);text-align:center;margin-bottom:13px;cursor:pointer;font-weight:bold;text-shadow:0 0 5px var(--accent);user-select:none}#track-info{font-size:11px;letter-spacing:6px;text-transform:uppercase;margin-bottom:15px;text-align:center;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 8px rgba(255,255,255,.5)}#progress-row{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:12px}.time-label{font-size:9px;color:#666;letter-spacing:1px;font-variant-numeric:tabular-nums}.time-label:last-child{text-align:right}#seek{width:100%;accent-color:var(--accent);cursor:pointer}.controls{display:flex;align-items:center;justify-content:space-between;gap:1px;overflow:visible}.control-btn{background:none;border:0;cursor:pointer;color:var(--dim);font-size:18px;transition:.2s;padding:8px 4px;min-width:34px;min-height:42px;flex:1}.control-btn.active{color:var(--accent);text-shadow:0 0 10px var(--accent)}.play-trigger{font-size:30px;color:#fff;flex:1.15}.volume-control{position:relative;display:flex;flex:1;justify-content:center}.volume-control>.control-btn{width:100%;flex:none}.vol-text{font-size:9px;font-weight:bold;letter-spacing:1px}.volume-control.open .vol-text{color:var(--accent);text-shadow:0 0 8px var(--accent)}#volume-popover{display:none;position:absolute;left:50%;bottom:48px;transform:translateX(-50%);width:52px;height:164px;background:rgba(3,3,3,.97);border:1px solid #292929;z-index:3500;padding:11px 8px 9px;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 0 22px rgba(0,242,255,.08)}.volume-control.open #volume-popover{display:flex}#volume-value{font-size:9px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:1px}#volume-slider-wrap{height:116px;width:30px;position:relative;overflow:visible}#volume{position:absolute;width:108px;height:24px;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) rotate(-90deg);accent-color:var(--accent);cursor:pointer;touch-action:none}#volume-zero{font-size:8px;color:#555;letter-spacing:1px}@media(max-width:360px){#player-ui{padding-left:14px;padding-right:14px}.control-btn{min-width:31px;padding-left:2px;padding-right:2px}}@media(max-height:660px){#player-ui{padding-top:10px;padding-bottom:12px}#visual-core{min-height:170px}#track-info{margin-bottom:8px}#progress-row{margin-bottom:6px}#volume-popover{height:146px}#volume-slider-wrap{height:98px}#volume{width:92px}}
</style>
</head>
<body>
<div id="stage">
<button id="install-btn" type="button">Install App</button>
<div id="install-sheet" aria-hidden="true"><div class="install-card"><div class="install-title">Install Minima</div><div class="install-copy" id="install-copy">Install Minima Player on your home screen.</div><button class="action-btn" id="install-close" type="button" style="width:100%">Got It</button></div></div>
<div id="empty-state"><label class="action-btn" style="padding:25px 60px;border-color:var(--accent)">Open File<input type="file" id="file-init" accept="audio/*,video/mp4" multiple></label></div>
<div id="drawer"><div style="font-size:11px;letter-spacing:5px;color:var(--dim);margin-bottom:20px">CATALOG</div><div id="playlist-content"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px"><label class="action-btn" style="text-align:center">Add Tracks<input type="file" id="file-add" accept="audio/*,video/mp4" multiple></label><button class="action-btn" id="reset-btn">Reset</button></div></div>
<div id="visual-area"><div id="visual-core"></div></div>
<div id="player-ui"><div id="fx-label">VISUAL: AMBIENT BARS</div><div id="track-info">Standby</div><div id="progress-row"><span class="time-label" id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek track"><span class="time-label" id="duration">0:00</span></div><div class="controls"><button class="control-btn" id="shuf-btn" aria-label="Shuffle">⤮</button><button class="control-btn" id="prev-btn" aria-label="Previous track">«</button><button class="control-btn play-trigger" id="play-btn" aria-label="Play">▶</button><button class="control-btn" id="next-btn" aria-label="Next track">»</button><button class="control-btn" id="rep-btn" aria-label="Repeat">⟳</button><div class="volume-control" id="volume-control"><button class="control-btn vol-text" id="volume-btn" type="button" aria-label="Volume" aria-expanded="false">VOL</button><div id="volume-popover" aria-hidden="true"><span id="volume-value">80</span><div id="volume-slider-wrap"><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume level"></div><span id="volume-zero">0</span></div></div><button class="control-btn" id="list-btn" aria-label="Playlist">☰</button></div></div>
</div>
<script>
const palette=['#00f2ff','#ffffff','#00ff95','#ff0055','#ffcc00'];const fxNames=['AMBIENT BARS','SONIC WAVEFRONT','PULSE GRID','ORBIT LINES'];const visualArea=document.getElementById('visual-area'),visualCore=document.getElementById('visual-core'),trackInfo=document.getElementById('track-info'),seek=document.getElementById('seek'),elapsed=document.getElementById('elapsed'),durationLabel=document.getElementById('duration'),playBtn=document.getElementById('play-btn'),shufBtn=document.getElementById('shuf-btn'),repBtn=document.getElementById('rep-btn'),drawer=document.getElementById('drawer'),installBtn=document.getElementById('install-btn'),installSheet=document.getElementById('install-sheet'),installCopy=document.getElementById('install-copy'),volume=document.getElementById('volume'),volumeValue=document.getElementById('volume-value'),volumeBtn=document.getElementById('volume-btn'),volumeControl=document.getElementById('volume-control'),volumePopover=document.getElementById('volume-popover');const audio=new Audio();audio.preload='metadata';let storedVolume=Number(localStorage.getItem('minimaVolume'));if(!Number.isFinite(storedVolume)||storedVolume<0||storedVolume>1)storedVolume=.8;audio.volume=storedVolume;let playlist=[],trackIdx=0,isPlaying=false,isShuffle=false,repeatMode=0,fxMode=0,particles=[],analyser=null,audioCtx=null,sourceNode=null,freqData=null,visualStarted=false,seeking=false,deferredInstallPrompt=null;
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function setInstallVisible(v){installBtn.classList.toggle('visible',v)}function showInstallSheet(msg){installCopy.innerHTML=msg;installSheet.classList.add('open');installSheet.setAttribute('aria-hidden','false')}async function installApp(){if(isStandalone()){setInstallVisible(false);return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();const c=await deferredInstallPrompt.userChoice;if(c.outcome==='accepted')setInstallVisible(false);deferredInstallPrompt=null;return}showInstallSheet(isIOS()?'On iPhone or iPad, tap the <strong>Share</strong> button in Safari, then choose <strong>Add to Home Screen</strong>.':'Open this page in Chrome or another install-capable browser, then use its <strong>Install app</strong> or <strong>Add to Home screen</strong> option.')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(!isStandalone())setInstallVisible(true)});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;setInstallVisible(false)});document.getElementById('install-close').onclick=()=>{installSheet.classList.remove('open');installSheet.setAttribute('aria-hidden','true')};installBtn.onclick=installApp;if(!isStandalone()&&isIOS())setInstallVisible(true);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
function setVolumeFromSlider(){const next=Math.max(0,Math.min(1,Number(volume.value)/100));audio.muted=false;audio.volume=next;localStorage.setItem('minimaVolume',String(next));syncVolumeUI()}function syncVolumeUI(){const pct=audio.muted?0:Math.round(audio.volume*100);volume.value=pct;volumeValue.textContent=pct;volumeBtn.textContent=pct===0?'MUTE':'VOL';volumeBtn.classList.toggle('active',pct===0)}function toggleVolume(){const open=!volumeControl.classList.contains('open');volumeControl.classList.toggle('open',open);volumeBtn.setAttribute('aria-expanded',String(open));volumePopover.setAttribute('aria-hidden',String(!open))}volumeBtn.addEventListener('click',e=>{e.stopPropagation();toggleVolume()});volumePopover.addEventListener('pointerdown',e=>e.stopPropagation());volume.addEventListener('input',setVolumeFromSlider);volumeControl.addEventListener('wheel',e=>{e.preventDefault();const next=Math.max(0,Math.min(100,Number(volume.value)+(e.deltaY<0?5:-5)));volume.value=next;setVolumeFromSlider()},{passive:false});document.addEventListener('pointerdown',e=>{if(!volumeControl.contains(e.target)&&volumeControl.classList.contains('open'))toggleVolume()});
function ensureAudioGraph(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;freqData=new Uint8Array(analyser.frequencyBinCount);sourceNode=audioCtx.createMediaElementSource(audio);sourceNode.connect(analyser);analyser.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume()}function initVisuals(){if(particles.length)return;for(let i=0;i<48;i++){const p=document.createElement('div');p.className='particle';p.style.color=palette[i%palette.length];visualCore.appendChild(p);particles.push(p)}if(!visualStarted){visualStarted=true;requestAnimationFrame(animateFX)}}function band(i){if(!analyser||!freqData)return .08;return freqData[Math.floor(i/Math.max(1,particles.length-1)*(freqData.length-1))]/255}function avg(a,b){if(!analyser||!freqData)return .08;let s=Math.floor(freqData.length*a),e=Math.max(s+1,Math.floor(freqData.length*b)),sum=0;for(let i=s;i<e;i++)sum+=freqData[i];return sum/(e-s)/255}function animateFX(now){if(analyser&&freqData)analyser.getByteFrequencyData(freqData);const t=now*.001,bass=avg(0,.12),mids=avg(.12,.48),highs=avg(.48,1),overall=bass*.5+mids*.35+highs*.15;particles.forEach((p,i)=>{const e=band(i),n=i/particles.length;let x=50,y=50,w=18+e*60,h=4+e*7,r=0,op=.18+Math.max(e,overall)*.9;if(fxMode===0){const a=n*Math.PI*2+t*(.14+overall*.2),rx=12+n*34+bass*8,ry=10+n*27+mids*7;x=50+Math.cos(a*2.15+i*.08)*rx;y=50+Math.sin(a*1.7+i*.11)*ry;r=a*180/Math.PI+e*80;w=16+e*72;h=3+e*8}else if(fxMode===1){const c=i%12,row=Math.floor(i/12),center=c/11-.5;x=50+center*82;y=50+(row-1.5)*11+Math.sin(t*3+c*.65)*(4+e*18);r=Math.cos(t*1.5+i)*14;w=16+e*48;h=4+e*10}else if(fxMode===2){const c=i%8,row=Math.floor(i/8);x=19+c*9;y=24+row*10.5;w=7+e*24;h=7+e*24;r=45;op=.1+e*.95}else{const a=n*Math.PI*2+t*(.25+bass*.8),ring=i%3,rad=18+ring*13+e*14;x=50+Math.cos(a)*rad;y=50+Math.sin(a)*rad;r=a*180/Math.PI+90;w=10+e*65;h=3+highs*6}p.style.left=x+'%';p.style.top=y+'%';p.style.width=w+'px';p.style.height=h+'px';p.style.opacity=Math.min(1,op);p.style.transform=`translate(-50%,-50%) rotate(${r}deg)`;p.style.filter=`brightness(${1.1+e*1.7})`});requestAnimationFrame(animateFX)}function cycleFX(){fxMode=(fxMode+1)%fxNames.length;document.getElementById('fx-label').textContent='VISUAL: '+fxNames[fxMode]}function gravityWell(cx,cy){const r=visualCore.getBoundingClientRect(),x=((cx-r.left)/r.width)*100,y=((cy-r.top)/r.height)*100;particles.forEach((p,i)=>p.animate([{transform:p.style.transform},{left:x+'%',top:y+'%',opacity:1,filter:'brightness(3)'}],{duration:280+i*5,direction:'alternate',iterations:2,easing:'cubic-bezier(.2,.8,.2,1)'}))}
function formatTime(s){if(!Number.isFinite(s)||s<0)return'0:00';return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')}function updateProgress(){if(!seeking&&Number.isFinite(audio.duration)&&audio.duration>0)seek.value=Math.round(audio.currentTime/audio.duration*1000);elapsed.textContent=formatTime(audio.currentTime);durationLabel.textContent=formatTime(audio.duration)}function revokeUrls(){playlist.forEach(t=>URL.revokeObjectURL(t.url))}function handleFiles(files){const songs=Array.from(files).map(f=>({name:f.name.replace(/\.[^/.]+$/,'').toUpperCase(),url:URL.createObjectURL(f)}));if(!songs.length)return;playlist=[...playlist,...songs];document.getElementById('empty-state').style.display='none';initVisuals();if(!audio.src)loadTrack(0);refreshUI()}function loadTrack(i){if(!playlist.length)return;trackIdx=Math.max(0,Math.min(i,playlist.length-1));const shouldPlay=isPlaying;audio.pause();audio.src=playlist[trackIdx].url;audio.load();trackInfo.textContent=playlist[trackIdx].name;seek.value=0;elapsed.textContent='0:00';durationLabel.textContent='0:00';if(shouldPlay){ensureAudioGraph();audio.play().catch(()=>{isPlaying=false;syncPlayButton()})}refreshUI()}function syncPlayButton(){playBtn.textContent=isPlaying?'॥':'▶';playBtn.setAttribute('aria-label',isPlaying?'Pause':'Play')}function togglePlay(){if(!audio.src)return;ensureAudioGraph();if(audio.paused)audio.play().catch(()=>{});else audio.pause()}function nextTrack(fromEnded=false){if(!playlist.length)return;if(isShuffle){if(playlist.length===1)return loadTrack(0);let n=trackIdx;while(n===trackIdx)n=Math.floor(Math.random()*playlist.length);return loadTrack(n)}if(trackIdx===playlist.length-1){if(repeatMode===1)return loadTrack(0);if(fromEnded){isPlaying=false;syncPlayButton();audio.currentTime=0;return updateProgress()}return loadTrack(0)}loadTrack(trackIdx+1)}function prevTrack(){if(playlist.length)loadTrack((trackIdx-1+playlist.length)%playlist.length)}function cycleRepeat(){repeatMode=(repeatMode+1)%3;repBtn.classList.remove('active');if(repeatMode===1){repBtn.textContent='⟳';repBtn.classList.add('active');repBtn.title='Repeat playlist'}else if(repeatMode===2){repBtn.textContent='⟲';repBtn.classList.add('active');repBtn.title='Repeat track'}else{repBtn.textContent='⟳';repBtn.title='Repeat off'}}function toggleShuffle(){isShuffle=!isShuffle;shufBtn.classList.toggle('active',isShuffle)}function toggleList(){drawer.classList.toggle('open')}function refreshUI(){const c=document.getElementById('playlist-content');c.innerHTML='';playlist.forEach((t,i)=>{const row=document.createElement('div');row.className='track-row '+(i===trackIdx?'playing':'');const name=document.createElement('span'),state=document.createElement('span');name.textContent=t.name;state.textContent=i===trackIdx?'PLAYING':'';row.append(name,state);row.onclick=()=>{loadTrack(i);toggleList()};c.appendChild(row)})}
document.getElementById('file-init').onchange=e=>handleFiles(e.target.files);document.getElementById('file-add').onchange=e=>handleFiles(e.target.files);document.getElementById('fx-label').onclick=cycleFX;document.getElementById('prev-btn').onclick=prevTrack;document.getElementById('next-btn').onclick=()=>nextTrack(false);playBtn.onclick=togglePlay;shufBtn.onclick=toggleShuffle;repBtn.onclick=cycleRepeat;document.getElementById('list-btn').onclick=toggleList;document.getElementById('reset-btn').onclick=()=>{revokeUrls();location.reload()};seek.addEventListener('pointerdown',()=>seeking=true);seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)elapsed.textContent=formatTime(Number(seek.value)/1000*audio.duration)});seek.addEventListener('change',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;seeking=false;updateProgress()});seek.addEventListener('pointerup',()=>seeking=false);audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('loadedmetadata',updateProgress);audio.addEventListener('volumechange',syncVolumeUI);audio.addEventListener('play',()=>{isPlaying=true;syncPlayButton()});audio.addEventListener('pause',()=>{if(!audio.ended){isPlaying=false;syncPlayButton()}});audio.addEventListener('ended',()=>{if(repeatMode===2){audio.currentTime=0;audio.play()}else nextTrack(true)});visualArea.addEventListener('pointerdown',e=>gravityWell(e.clientX,e.clientY));window.addEventListener('beforeunload',revokeUrls);syncPlayButton();syncVolumeUI();repBtn.title='Repeat off';
</script>
</body>
</html>
